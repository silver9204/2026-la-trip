<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="2026 LA 가족여행 정산 대시보드와 모바일 일정 가이드" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>2026 LA 여행 · 정산</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=42" />
  </head>
  <body>
    <a class="skip-link" href="#app">본문 바로가기</a>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="#settlement" aria-label="정산 홈으로">
          <span class="brand-mark">LA</span>
          <span>
            <b>LA Trip</b>
            <small>2026. 7. 24 — 8. 3</small>
          </span>
        </a>
        <div class="topbar-actions">
          <nav class="view-switch" aria-label="화면 전환">
            <a href="#settlement" data-view="settlement">정산</a>
            <a href="#home" data-view="travel">여행계획</a>
          </nav>
          <button class="day-picker-button" id="dayPickerButton" type="button" aria-haspopup="dialog">Day 선택</button>
        </div>
      </header>

      <main id="app" tabindex="-1" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="주요 메뉴">
        <a href="#home" data-nav="home"><span>⌂</span>홈</a>
        <a href="#days" data-nav="days"><span>▤</span>일정</a>
        <a href="#reservations" data-nav="reservations"><span>▣</span>예약</a>
        <a href="#info" data-nav="info"><span>●</span>여행정보</a>
      </nav>
    </div>

    <dialog class="day-dialog" id="dayDialog" aria-labelledby="dayDialogTitle">
      <div class="dialog-head">
        <div>
          <small>빠른 이동</small>
          <h2 id="dayDialogTitle">날짜 선택</h2>
        </div>
        <button id="closeDayDialog" type="button" aria-label="닫기">×</button>
      </div>
      <div class="dialog-days" id="dialogDays"></div>
    </dialog>

    <noscript>이 여행 가이드는 JavaScript를 사용합니다.</noscript>
    <script src="./settlement-data.js?v=42"></script>
    <script src="./app.js?v=42"></script>
  </body>
</html>
